name: Set up the catalog toolchain
description: Install the pinned runtime, package manager and frozen dependencies for catalog jobs.
runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version-file: .node-version
        run-install: false
    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
