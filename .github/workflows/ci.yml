name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  VITEST_MAX_WORKERS: "2"

jobs:
  repair-toolchain:
    needs: plan
    if: needs.plan.outputs.repair_toolchain == 'true'
    runs-on: ubuntu-latest
    env:
      VP_HOME: /tmp/kmodels-vite-plus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the repair environment without inference
        uses: ./.github/actions/setup-repair-toolchain

      - name: Verify the environment persists to subsequent steps
        run: |
          vp env doctor
          vp node --version

      - name: Verify isolated Codex protocol without paid inference
        run: |
          docker build --file .github/repair-codex.Dockerfile --tag kmodels-repair-codex:local .github
          vp node scripts/repair/codex-smoke.ts

      - name: Verify the Catalog repair workflow frontmatter lock
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/gh-aw-v0.89.21"
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 -o "$compiler"
          printf '%s  %s\n' 1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b "$compiler" | sha256sum --check
          chmod +x "$compiler"
          expected="$("$compiler" hash-frontmatter .github/workflows/catalog-repair.md)"
          locked="$(sed -n '1s/.*"frontmatter_hash":"\([a-f0-9]*\)".*/\1/p' .github/workflows/catalog-repair.lock.yml)"
          if [[ "$expected" != "$locked" ]]; then
            echo "::error::Catalog repair workflow lock is stale. Regenerate it with the pinned compiler and action tag."
            exit 1
          fi

  plan:
    runs-on: ubuntu-latest
    outputs:
      repair_toolchain: ${{ steps.validate.outputs.repair_toolchain }}
      groups: ${{ steps.validate.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up catalog toolchain
        uses: ./.github/actions/setup-catalog-toolchain

      - name: Select affected contracts and run source-only changes
        id: validate
        run: vp node scripts/validate-changes.ts "$VALIDATION_BASE" --ci=plan

  contracts:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-catalog-toolchain
      - name: Validate affected contracts
        env:
          GROUP: ${{ matrix.group }}
          PRICING_PERFORMANCE_REPORT: ${{ runner.temp }}/pricing-performance/report.json
        run: vp node scripts/validate-changes.ts "$VALIDATION_BASE" --ci="$GROUP"

      - name: Upload pricing performance evidence
        if: always() && matrix.group == 'browser'
        uses: actions/upload-artifact@v7
        with:
          name: pricing-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-performance/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: [plan, contracts, repair-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN: ${{ needs.plan.result }}
          GROUPS_JSON: ${{ needs.plan.outputs.groups }}
          CONTRACTS: ${{ needs.contracts.result }}
          REPAIR: ${{ needs.repair-toolchain.result }}
          NEED_REPAIR: ${{ needs.plan.outputs.repair_toolchain }}
        run: |
          test "$PLAN" = success
          if [[ "$GROUPS_JSON" = '[]' ]]; then test "$CONTRACTS" = skipped; else test "$CONTRACTS" = success; fi
          if [[ "$NEED_REPAIR" = true ]]; then test "$REPAIR" = success; else test "$REPAIR" = skipped; fi
