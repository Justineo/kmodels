name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repair-toolchain:
    needs: verify
    if: needs.verify.outputs.repair_toolchain == 'true'
    runs-on: ubuntu-latest
    env:
      VP_HOME: /tmp/kmodels-vite-plus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the repair environment without inference
        uses: ./.github/actions/setup-repair-toolchain

      - name: Verify the environment persists to subsequent steps
        run: |
          vp env doctor
          vp node --version

      - name: Verify the Catalog repair workflow frontmatter lock
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/gh-aw-v0.89.21"
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 -o "$compiler"
          printf '%s  %s\n' 1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b "$compiler" | sha256sum --check
          chmod +x "$compiler"
          expected="$("$compiler" hash-frontmatter .github/workflows/catalog-repair.md)"
          locked="$(sed -n '1s/.*"frontmatter_hash":"\([a-f0-9]*\)".*/\1/p' .github/workflows/catalog-repair.lock.yml)"
          if [[ "$expected" != "$locked" ]]; then
            echo "::error::Catalog repair workflow lock is stale. Regenerate it with the pinned compiler and action tag."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    outputs:
      repair_toolchain: ${{ steps.validate.outputs.repair_toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.21.0
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install the pinned performance browser
        run: vp exec playwright install --with-deps chromium

      - name: Hydrate the checked-out catalog
        run: vp node scripts/catalog-snapshot.ts hydrate

      - name: Validate affected contracts
        id: validate
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VITEST_MAX_WORKERS: "2"
          PRICING_PERFORMANCE_REPORT: ${{ runner.temp }}/pricing-performance/report.json
        run: vp node scripts/validate-changes.ts "$VALIDATION_BASE"

      - name: Upload pricing performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricing-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-performance/
          if-no-files-found: ignore
          retention-days: 7
