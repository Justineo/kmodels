name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repair-toolchain:
    needs: verify
    if: needs.verify.outputs.repair_toolchain == 'true'
    runs-on: ubuntu-latest
    env:
      VP_HOME: /tmp/kmodels-vite-plus
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the repair environment without inference
        uses: ./.github/actions/setup-repair-toolchain

      - name: Verify the environment persists to subsequent steps
        run: |
          vp env doctor
          vp node --version

  verify:
    runs-on: ubuntu-latest
    outputs:
      repair_toolchain: ${{ steps.validate.outputs.repair_toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.22.0
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate affected contracts
        id: validate
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: vp node scripts/validate-changes.ts "$VALIDATION_BASE"
