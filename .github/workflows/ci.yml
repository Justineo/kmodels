name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  VITEST_MAX_WORKERS: "2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.validate.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up catalog toolchain
        uses: ./.github/actions/setup-catalog-toolchain

      - name: Select affected contracts and run source-only changes
        id: validate
        run: vp node scripts/validate-changes.ts "$VALIDATION_BASE" --ci=plan

  contracts:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-catalog-toolchain
      - name: Validate affected contracts
        env:
          GROUP: ${{ matrix.group }}
          PRICING_PERFORMANCE_REPORT: ${{ runner.temp }}/pricing-performance/report.json
        run: vp node scripts/validate-changes.ts "$VALIDATION_BASE" --ci="$GROUP"

      - name: Upload pricing performance evidence
        if: always() && matrix.group == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pricing-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-performance/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: [plan, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN: ${{ needs.plan.result }}
          GROUPS_JSON: ${{ needs.plan.outputs.groups }}
          CONTRACTS: ${{ needs.contracts.result }}
        run: |
          test "$PLAN" = success
          if [[ "$GROUPS_JSON" = '[]' ]]; then test "$CONTRACTS" = skipped; else test "$CONTRACTS" = success; fi
