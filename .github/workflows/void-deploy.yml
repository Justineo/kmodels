name: Deploy to Void

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VOID_API_URL: https://api.void.cloud
      VOID_PROJECT: ${{ vars.VOID_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep commit/tree history for the catalog update link, without historical blobs.
          fetch-depth: 0
          filter: blob:none
          ref: main
          sparse-checkout-cone-mode: false
          # Keep the full TypeScript check scope and the checked-out snapshot pointer.
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /tests/
            !/tests/fixtures/
            /public/
            /data/catalog-snapshot.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Hydrate the checked-out catalog
        run: vp node scripts/catalog-snapshot.ts hydrate

      - name: Build static site
        run: vp run build

      - name: Install the pinned performance browser
        run: vp exec playwright install --with-deps chromium

      - name: Check pricing interaction performance
        env:
          PRICING_PERFORMANCE_REPORT: ${{ runner.temp }}/pricing-performance/report.json
        run: vp run test:pricing-performance

      - name: Upload pricing performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-performance/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy
        run: |
          vp exec void connect "$VOID_API_URL" --no-login
          vp run deploy
