name: Deploy to Void

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VOID_PROJECT: ${{ vars.VOID_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep commit/tree history for the catalog update link, without historical blobs.
          fetch-depth: 0
          filter: blob:none
          ref: main
          sparse-checkout-cone-mode: false
          # Keep the full TypeScript check scope; production reads only these data projections.
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /tests/
            !/tests/fixtures/
            /public/
            /data/website-assets.json
            /data/website-assets.pack
            /data/export-assets.json
            /data/export-assets.pack

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build static site
        run: vp run build

      - name: Deploy
        run: vp run deploy
