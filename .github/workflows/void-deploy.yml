name: Deploy to Void

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    concurrency:
      group: void-production
      cancel-in-progress: true
    outputs:
      receipt: ${{ steps.receipt.outputs.artifact-id }}
    runs-on: ubuntu-latest
    env:
      VOID_API_URL: https://api.void.cloud
      VOID_PROJECT: ${{ vars.VOID_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep commit/tree history for the catalog update link, without historical blobs.
          fetch-depth: 0
          filter: blob:none
          ref: main
          sparse-checkout-cone-mode: false
          # Keep the full TypeScript check scope and the checked-out snapshot pointer.
          sparse-checkout: |
            /*
            !/*/
            /.github/actions/setup-catalog-toolchain/
            /src/
            /scripts/
            /tests/
            !/tests/fixtures/
            /public/
            /data/catalog-snapshot.json

      - name: Set up catalog toolchain
        uses: ./.github/actions/setup-catalog-toolchain

      - name: Hydrate the checked-out catalog
        run: vp node scripts/catalog-snapshot.ts hydrate

      - name: Build static site
        run: vp run build

      - name: Install the pinned performance browser
        run: vp exec playwright install --with-deps chromium --only-shell

      - name: Check pricing interaction performance
        env:
          PRICING_PERFORMANCE_REPORT: ${{ runner.temp }}/pricing-performance/report.json
        run: vp run test:pricing-performance

      - name: Upload pricing performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-performance/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy
        run: |
          vp exec void connect "$VOID_API_URL" --no-login
          vp run deploy

      - name: Record the successfully deployed catalog identity
        env:
          MAINTENANCE_OUTPUT: ${{ runner.temp }}/catalog-deployment
        run: vp node scripts/repair/deployment-receipt.ts

      - name: Preserve the deployment receipt
        id: receipt
        uses: actions/upload-artifact@v7
        with:
          name: catalog-deployment-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-deployment/deployment.json
          if-no-files-found: error
          retention-days: 30

  record-deployment:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: catalog-maintenance-state
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-catalog-toolchain
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.deploy.outputs.receipt }}
          merge-multiple: true
          path: ${{ runner.temp }}/deployed
      - name: Record the deployed snapshot in the maintenance ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp node scripts/repair/maintenance.ts record-deployment "$RUNNER_TEMP/deployed/deployment.json"
