openapi: 3.1.0
servers:
  - url: https://api.cohere.com
paths:
  /v1/chat:
    post:
      operationId: chat
  /v2/chat:
    post:
      operationId: chatv2
  /v1/embed:
    post:
      operationId: embed
  /v2/embed:
    post:
      operationId: embedv2
  /v1/embed-jobs:
    post:
      operationId: create-embed-job
  /v1/rerank:
    post:
      operationId: rerank
  /v2/rerank:
    post:
      operationId: rerankv2
  /v2/audio/transcriptions:
    post:
      operationId: create-transcription
  /v1/models:
    get:
      operationId: list-models
      parameters:
        - name: page_size
          description: Defaults to `20`, min value of `1`, max value of `1000`.
        - name: page_token
          description: Page token provided in the `next_page_token` field.
        - name: endpoint
          schema:
            $ref: "#/components/schemas/CompatibleEndpoint"
        - name: default_only
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModelsResponse"
components:
  schemas:
    ApiMeta:
      type: object
      properties:
        billed_units:
          type: object
          properties:
            images:
              type: number
            input_tokens:
              type: number
            image_tokens:
              type: number
            output_tokens:
              type: number
            search_units:
              type: number
            classifications:
              type: number
        tokens:
          type: object
        cached_tokens:
          type: number
    Usage:
      type: object
      properties:
        billed_units:
          type: object
          properties:
            input_tokens:
              type: number
            output_tokens:
              type: number
            search_units:
              type: number
            classifications:
              type: number
        tokens:
          type: object
        cached_tokens:
          type: number
    ChatResponseV2:
      properties:
        usage:
          $ref: "#/components/schemas/Usage"
    CompatibleEndpoint:
      type: string
      enum:
        - chat
        - embed
        - classify
        - summarize
        - rerank
        - rate
        - generate
    GetModelResponse:
      type: object
      properties:
        name:
          type: string
        is_deprecated:
          type: boolean
        endpoints:
          type: array
        finetuned:
          type: boolean
        context_length:
          type: number
        tokenizer_url:
          type: string
        default_endpoints:
          type: array
        features:
          type: array
        sampling_defaults:
          type: object
    ListModelsResponse:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/GetModelResponse"
        next_page_token:
          type: string
