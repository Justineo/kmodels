openapi: 3.1.0
paths:
  /v1/models:
    get:
      operationId: list_models_v1_models_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
components:
  schemas:
    BaseModelCard:
      properties:
        id:
          type: string
        capabilities:
          $ref: "#/components/schemas/ModelCapabilities"
        aliases:
          type: array
        deprecation:
          type: string
        deprecation_replacement_model:
          type: string
        type:
          type: string
          const: base
      required:
        - id
        - capabilities
    FTModelCard:
      properties:
        id:
          type: string
        capabilities:
          $ref: "#/components/schemas/ModelCapabilities"
        type:
          type: string
          const: fine-tuned
        job:
          type: string
        root:
          type: string
      required:
        - id
        - capabilities
        - job
        - root
    ModelCapabilities:
      properties:
        completion_chat:
          type: boolean
        function_calling:
          type: boolean
        completion_fim:
          type: boolean
        fine_tuning:
          type: boolean
        vision:
          type: boolean
        ocr:
          type: boolean
        classification:
          type: boolean
        moderation:
          type: boolean
        audio:
          type: boolean
        audio_transcription:
          type: boolean
    ModelList:
      properties:
        object:
          type: string
        data:
          items:
            oneOf:
              - $ref: "#/components/schemas/BaseModelCard"
              - $ref: "#/components/schemas/FTModelCard"
            discriminator:
              propertyName: type
          type: array
    ConversationUsageInfo:
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        connector_tokens:
          type: integer
        connectors:
          type: object
    ConversationResponse:
      properties:
        usage:
          $ref: "#/components/schemas/ConversationUsageInfo"
    OCRResponse:
      properties:
        usage_info:
          $ref: "#/components/schemas/OCRUsageInfo"
    OCRUsageInfo:
      properties:
        pages_processed:
          type: integer
    TranscriptionResponse:
      properties:
        usage:
          $ref: "#/components/schemas/UsageInfo"
    TranscriptionStreamDone:
      properties:
        usage:
          $ref: "#/components/schemas/UsageInfo"
    PromptTokensDetails:
      properties:
        cached_tokens:
          type: integer
    UsageInfo:
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        prompt_audio_seconds:
          type: integer
        prompt_tokens_details:
          $ref: "#/components/schemas/PromptTokensDetails"
    SpeechResponse:
      properties:
        audio_data:
          type: string
    SpeechStreamDone:
      properties:
        usage:
          $ref: "#/components/schemas/UsageInfo"
    CompletionChunk:
      properties:
        usage:
          $ref: "#/components/schemas/UsageInfo"
    ResponseBase:
      properties:
        usage:
          $ref: "#/components/schemas/UsageInfo"
