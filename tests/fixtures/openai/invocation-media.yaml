servers:
  - url: https://api.openai.com/v1
security:
  - ApiKeyAuth: []
paths:
  /audio/transcriptions:
    post:
      operationId: createTranscription
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTranscriptionRequest"
  /audio/translations:
    post:
      operationId: createTranslation
      deprecated: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTranslationRequest"
  /images/edits:
    post:
      operationId: createImageEdit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateImageEditRequest"
            examples:
              multipart_edit:
                summary: Multipart form upload (binary image + prompt)
                value:
                  model: gpt-image-1.5
                  prompt: Add a watercolor effect to this image
                  image: <binary image file>
                  size: 1024x1024
                  quality: high
          application/json:
            schema:
              $ref: "#/components/schemas/EditImageBodyJsonParam"
            examples:
              json_with_url:
                summary: JSON request with image URL
                value:
                  model: gpt-image-1.5
                  prompt: Add a watercolor effect to this image
                  images:
                    - image_url: https://example.com/source-image.png
                  size: 1024x1024
                  quality: high
              json_with_file_id:
                summary: JSON request with uploaded file id
                value:
                  model: gpt-image-1.5
                  prompt: Replace the background with a snowy mountain scene
                  images:
                    - file_id: file-abc123
                  mask:
                    file_id: file-mask123
                  output_format: png
                  output_compression: 100
  /videos:
    post:
      operationId: createVideo
      parameters: []
      deprecated: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateVideoMultipartBody"
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoJsonBody"
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
  schemas:
    CreateTranscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        file:
          description: >
            The audio file object (not file name) to transcribe, in one of these
            formats: flac, mp3, mp4, mpeg, mpga, m4a, ogg, wav, or webm.

            The request must include enough format metadata for the file to be
            identified. We recommend an extension-bearing filename and an
            appropriate content type.
          type: string
          x-oaiTypeLabel: file
          format: binary
        model:
          description: >
            ID of the model to use. The options are `gpt-transcribe`,
            `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`,
            `gpt-4o-mini-transcribe-2025-12-15`, `whisper-1` (which is powered
            by our open source Whisper V2 model), and
            `gpt-4o-transcribe-diarize`.
          example: gpt-4o-transcribe
          anyOf:
            - type: string
            - type: string
              enum:
                - whisper-1
                - gpt-transcribe
                - gpt-4o-transcribe
                - gpt-4o-mini-transcribe
                - gpt-4o-mini-transcribe-2025-12-15
                - gpt-4o-transcribe-diarize
              x-openai-enum-deprecations:
                gpt-4o-mini-transcribe-2025-12-15:
                  message: "Announced shutdown date: 2027-02-26. See
                    https://developers.openai.com/api/docs/deprecations for
                    details and recommended replacements."
                whisper-1:
                  message: "Announced shutdown date: 2027-02-26. See
                    https://developers.openai.com/api/docs/deprecations for
                    details and recommended replacements."
                gpt-4o-transcribe:
                  message: "Announced shutdown date: 2027-02-26. See
                    https://developers.openai.com/api/docs/deprecations for
                    details and recommended replacements."
                gpt-4o-mini-transcribe:
                  message: "Announced shutdown date: 2027-02-26. See
                    https://developers.openai.com/api/docs/deprecations for
                    details and recommended replacements."
                gpt-4o-transcribe-diarize:
                  message: "Announced shutdown date: 2027-02-26. See
                    https://developers.openai.com/api/docs/deprecations for
                    details and recommended replacements."
              x-stainless-const: true
          x-oaiTypeLabel: string
        language:
          description: >
            The language of the input audio. Supplying the input language in
            [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
            (e.g. `en`) format will improve accuracy and latency.
          type: string
        languages:
          description: >
            Possible languages of the input audio, in
            [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
            format. Supported by `gpt-transcribe`.
          type: array
          minItems: 1
          items:
            type: string
        keywords:
          description: >
            Words or phrases to guide transcription of the input audio.
            Supported by `gpt-transcribe`.
          type: array
          items:
            type: string
        prompt:
          description: |
            An optional text to guide the model's style or continue a previous audio segment. The [prompt](https://developers.openai.com/api/docs/guides/speech-to-text#prompting) should match the audio language. This field is not supported when using `gpt-4o-transcribe-diarize`.
          type: string
        response_format:
          $ref: "#/components/schemas/AudioResponseFormat"
        temperature:
          description: >
            The sampling temperature, between 0 and 1. Higher values like 0.8
            will make the output more random, while lower values like 0.2 will
            make it more focused and deterministic. If set to 0, the model will
            use [log probability](https://en.wikipedia.org/wiki/Log_probability)
            to automatically increase the temperature until certain thresholds
            are hit.
          type: number
          default: 0
        include:
          description: >
            Additional information to include in the transcription response.

            `logprobs` will return the log probabilities of the tokens in the

            response to understand the model's confidence in the transcription.

            `logprobs` only works with response_format set to `json` and only
            with

            the models `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`, and
            `gpt-4o-mini-transcribe-2025-12-15`. This field is not supported
            when using `gpt-4o-transcribe-diarize`.
          type: array
          items:
            $ref: "#/components/schemas/TranscriptionInclude"
        timestamp_granularities:
          description: >
            The timestamp granularities to populate for this transcription.
            `response_format` must be set `verbose_json` to use timestamp
            granularities. Either or both of these options are supported:
            `word`, or `segment`. Note: There is no additional latency for
            segment timestamps, but generating word timestamps incurs additional
            latency.

            This option is not available for `gpt-4o-transcribe-diarize`.
          type: array
          items:
            type: string
            enum:
              - word
              - segment
          default:
            - segment
        stream:
          anyOf:
            - description: |
                If set to true, the model response data will be streamed to the client
                as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).
                See the [Streaming section of the Speech-to-Text guide](https://developers.openai.com/api/docs/guides/speech-to-text?lang=curl#streaming)
                for more information.

                Note: Streaming is not supported for the `whisper-1` model and will be ignored.
              type: boolean
              default: false
            - type: "null"
        chunking_strategy:
          anyOf:
            - description: 'Controls how the audio is cut into chunks. When set to `"auto"`,
                the server first normalizes loudness and then uses voice
                activity detection (VAD) to choose boundaries. `server_vad`
                object can be provided to tweak VAD detection parameters
                manually. If unset, the audio is transcribed as a single block.
                Required when using `gpt-4o-transcribe-diarize` for inputs
                longer than 30 seconds. '
              anyOf:
                - type: string
                  enum:
                    - auto
                  default: auto
                  description: >
                    Automatically set chunking parameters based on the audio.
                    Must be set to `"auto"`.
                  x-stainless-const: true
                - $ref: "#/components/schemas/VadConfig"
              x-oaiTypeLabel: string
            - type: "null"
        known_speaker_names:
          description: >
            Optional list of speaker names that correspond to the audio samples
            provided in `known_speaker_references[]`. Each entry should be a
            short identifier (for example `customer` or `agent`). Up to 4
            speakers are supported.
          type: array
          maxItems: 4
          items:
            type: string
        known_speaker_references:
          description: |
            Optional list of audio samples (as [data URLs](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URLs)) that contain known speaker references matching `known_speaker_names[]`. Each sample must be between 2 and 10 seconds, and can use any of the same input audio formats supported by `file`.
          type: array
          maxItems: 4
          items:
            type: string
      required:
        - file
        - model
    CreateTranslationRequest:
      type: object
      additionalProperties: false
      properties:
        file:
          description: >
            The audio file object (not file name) translate, in one of these
            formats: flac, mp3, mp4, mpeg, mpga, m4a, ogg, wav, or webm. The
            request must include enough format metadata for the file to be
            identified. We recommend an extension-bearing filename and an
            appropriate content type.
          type: string
          x-oaiTypeLabel: file
          format: binary
        model:
          description: >
            ID of the model to use. Only `whisper-1` (which is powered by our
            open source Whisper V2 model) is currently available.
          example: whisper-1
          anyOf:
            - type: string
            - type: string
              enum:
                - whisper-1
              x-stainless-const: true
          x-oaiTypeLabel: string
        prompt:
          description: |
            An optional text to guide the model's style or continue a previous audio segment. The [prompt](https://developers.openai.com/api/docs/guides/speech-to-text#prompting) should be in English.
          type: string
        response_format:
          description: >
            The format of the output, in one of these options: `json`, `text`,
            `srt`, `verbose_json`, or `vtt`.
          type: string
          enum:
            - json
            - text
            - srt
            - verbose_json
            - vtt
          default: json
        temperature:
          description: >
            The sampling temperature, between 0 and 1. Higher values like 0.8
            will make the output more random, while lower values like 0.2 will
            make it more focused and deterministic. If set to 0, the model will
            use [log probability](https://en.wikipedia.org/wiki/Log_probability)
            to automatically increase the temperature until certain thresholds
            are hit.
          type: number
          default: 0
      required:
        - file
        - model
    CreateImageEditRequest:
      type: object
      properties:
        image:
          anyOf:
            - type: string
              format: binary
            - type: array
              maxItems: 16
              items:
                type: string
                format: binary
          description: >
            The image(s) to edit. Must be a supported image file or an array of
            images.


            For the GPT image models (`gpt-image-1-mini`, `gpt-image-1.5`,

            `gpt-image-2`, `gpt-image-2-2026-04-21`, `gpt-image-2.5-sunburst`,

            `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`, and

            `gpt-image-2.5-flare-2026-09-08`), each image should be a `png`,
            `webp`, or `jpg`

            file less than 50MB. You can provide up to 16 images.
            `chatgpt-image-latest`

            follows the same input constraints as GPT image models.
        prompt:
          description: A text description of the desired image(s). The maximum length is
            32000 characters for the GPT image models.
          type: string
          example: A cute baby sea otter wearing a beret
        mask:
          description: An additional image whose fully transparent areas (e.g. where alpha
            is zero) indicate where `image` should be edited. If there are
            multiple images provided, the mask will be applied on the first
            image. Must be a valid PNG file, less than 4MB, and have the same
            dimensions as `image`.
          type: string
          format: binary
        markup:
          $ref: "#/components/schemas/markup"
        background:
          anyOf:
            - type: string
              enum:
                - transparent
                - opaque
                - auto
            - type: "null"
          default: auto
          example: transparent
          description: >
            Set the background of the generated image(s). This parameter is only
            supported for

            the GPT image models. Must be one of `transparent`, `opaque`, or
            `auto` (default

            value). When `auto` is used, the model will automatically determine
            the best

            background for the image.


            `gpt-image-2.5-sunburst` and `gpt-image-2.5-flare`, including their
            `2026-09-08`

            snapshots, support `opaque` and `transparent` backgrounds.
            Transparent backgrounds

            are available for supported GPT Image models. For `gpt-image-2` and

            `gpt-image-2-2026-04-21`, this support is in preview. When using
            `transparent`,

            set the output format to `png` or `webp`.
        model:
          anyOf:
            - type: string
            - type: string
              enum:
                - gpt-image-1.5
                - gpt-image-2
                - gpt-image-2-2026-04-21
                - gpt-image-2.5-sunburst
                - gpt-image-2.5-sunburst-2026-09-08
                - gpt-image-2.5-flare
                - gpt-image-2.5-flare-2026-09-08
                - gpt-image-1
                - gpt-image-1-mini
                - chatgpt-image-latest
                - dall-e-2
              x-openai-enum-deprecations:
                gpt-image-1:
                  message: GPT Image 1 was shut down on October 23, 2026. Use
                    gpt-image-2.5-sunburst or gpt-image-2.5-flare instead.
                dall-e-2:
                  message: This model was retired on May 12, 2026. Use a GPT image model instead.
              x-stainless-const: true
          x-oaiTypeLabel: string
          example: gpt-image-1.5
          description: |
            The GPT image model to use for image editing
            (`gpt-image-1-mini`, `gpt-image-1.5`, `gpt-image-2`,
            `gpt-image-2-2026-04-21`, `gpt-image-2.5-sunburst`,
            `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`,
            `gpt-image-2.5-flare-2026-09-08`, or `chatgpt-image-latest`).

            `gpt-image-1` was shut down on October 23, 2026. Use
            `gpt-image-2.5-sunburst` or `gpt-image-2.5-flare` instead.
        n:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 10
          default: 1
          example: 1
          description: The number of images to generate. Must be between 1 and 10.
        size:
          anyOf:
            - type: string
            - type: string
              enum:
                - 1024x1024
                - 1536x1024
                - 1024x1536
                - auto
                - 256x256
                - 512x512
              x-openai-enum-deprecations:
                256x256:
                  message: This legacy size suggestion is retained for SDK compatibility. Check
                    the selected GPT image model's supported sizes.
                512x512:
                  message: This legacy size suggestion is retained for SDK compatibility. Check
                    the selected GPT image model's supported sizes.
            - type: "null"
          default: auto
          example: 1024x1024
          description: The size of the generated images. Defaults to `auto`. For
            `gpt-image-2`, `gpt-image-2-2026-04-21`, `gpt-image-2.5-sunburst`,
            `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`, and
            `gpt-image-2.5-flare-2026-09-08`, arbitrary resolutions are
            supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width
            and height must both be divisible by 16 and the requested aspect
            ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are
            experimental, and the maximum supported resolution is `3840x2160`.
            The requested size must also satisfy the model's current pixel and
            edge limits. The standard sizes `1024x1024`, `1536x1024`, and
            `1024x1536` are supported by the GPT image models; `auto` is
            supported for models that allow automatic sizing.
        response_format:
          type:
            - string
            - "null"
          enum:
            - url
            - b64_json
            - null
          deprecated: true
          description: Legacy response format parameter for retired image models.
            Unsupported for GPT image models, which always return base64-encoded
            images.
        output_format:
          anyOf:
            - type: string
              enum:
                - png
                - jpeg
                - webp
            - type: "null"
          default: png
          example: png
          description: >
            The format in which the generated images are returned. This
            parameter is

            only supported for the GPT image models. Must be one of `png`,
            `jpeg`, or `webp`.

            The default value is `png`.
        output_compression:
          type:
            - integer
            - "null"
          default: 100
          example: 100
          description: >
            The compression level (0-100%) for the generated images. This
